<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Internet Speed Test</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            width: 90%;
            max-width: 450px;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 25px;
            background: linear-gradient(90deg, #00d2ff, #3a7bd5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .ip-info {
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 0.9rem;
        }

        .ip-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .ip-row:last-child {
            border-bottom: none;
        }

        .ip-label {
            color: #aaa;
        }

        .ip-value {
            color: #00d2ff;
            font-weight: bold;
            text-align: right;
            max-width: 60%;
            word-break: break-all;
        }

        .speed-display {
            margin: 20px 0;
            padding: 30px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 15px;
        }

        .speed-value {
            font-size: 3rem;
            font-weight: bold;
            color: #00ff88;
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
        }

        .speed-unit {
            font-size: 1.2rem;
            color: #aaa;
        }

        .speed-type {
            font-size: 1rem;
            margin-top: 10px;
            color: #3a7bd5;
        }

        .results {
            margin-top: 15px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
            font-size: 0.9rem;
        }

        .result-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .result-item:last-child {
            border-bottom: none;
        }

        .result-label {
            color: #aaa;
        }

        .result-value {
            color: #00ff88;
            font-weight: bold;
        }

        .btn {
            margin: 10px 5px;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-download {
            background: linear-gradient(90deg, #00d2ff, #3a7bd5);
            color: white;
        }

        .btn-upload {
            background: linear-gradient(90deg, #ff6b6b, #ffa500);
            color: white;
        }

        .btn-both {
            background: linear-gradient(90deg, #00ff88, #00d2ff);
            color: white;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .status {
            margin-top: 20px;
            font-size: 0.9rem;
            color: #aaa;
        }

        .loader {
            display: none;
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.2);
            border-top-color: #00ff88;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Internet Speed Test</h1>

        <div class="ip-info">
            <div class="ip-row">
                <span class="ip-label">IP Address:</span>
                <span class="ip-value" id="ipAddress">Loading...</span>
            </div>
            <div class="ip-row">
                <span class="ip-label">Country:</span>
                <span class="ip-value" id="country">Loading...</span>
            </div>
            <div class="ip-row">
                <span class="ip-label">City:</span>
                <span class="ip-value" id="city">Loading...</span>
            </div>
            <div class="ip-row">
                <span class="ip-label">ISP:</span>
                <span class="ip-value" id="isp">Loading...</span>
            </div>
        </div>

        <div class="speed-display">
            <div class="speed-value" id="speedValue">0.00</div>
            <div class="speed-unit">Mbps</div>
            <div class="speed-type" id="speedType">Ready to test</div>
        </div>

        <div class="results" id="results" style="display: none;">
            <div class="result-item">
                <span class="result-label">Download:</span>
                <span class="result-value" id="downloadResult">--</span>
            </div>
            <div class="result-item">
                <span class="result-label">Upload:</span>
                <span class="result-value" id="uploadResult">--</span>
            </div>
            <div class="result-item">
                <span class="result-label">Ping:</span>
                <span class="result-value" id="pingResult">--</span>
            </div>
        </div>

        <div class="loader" id="loader"></div>

        <div>
            <button class="btn btn-download" id="btnDownload" onclick="testSpeed('download')">Download</button>
            <button class="btn btn-upload" id="btnUpload" onclick="testSpeed('upload')">Upload</button>
            <button class="btn btn-both" id="btnBoth" onclick="testBoth()">Both</button>
        </div>

        <div class="status" id="status">Click a button to start test</div>
    </div>

    <script>
        const speedValue = document.getElementById('speedValue');
        const speedType = document.getElementById('speedType');
        const status = document.getElementById('status');
        const loader = document.getElementById('loader');
        const results = document.getElementById('results');
        const downloadResult = document.getElementById('downloadResult');
        const uploadResult = document.getElementById('uploadResult');
        const pingResult = document.getElementById('pingResult');
        const btnDownload = document.getElementById('btnDownload');
        const btnUpload = document.getElementById('btnUpload');
        const btnBoth = document.getElementById('btnBoth');
        const ipAddressEl = document.getElementById('ipAddress');
        const countryEl = document.getElementById('country');
        const cityEl = document.getElementById('city');
        const ispEl = document.getElementById('isp');

        function setButtonsDisabled(disabled) {
            btnDownload.disabled = disabled;
            btnUpload.disabled = disabled;
            btnBoth.disabled = disabled;
        }

        function updateDisplay(value, type) {
            speedValue.textContent = value.toFixed(2);
            speedType.textContent = type;
        }

        async function fetchIPInfo() {
            try {
                const response = await fetch('https://ipwho.is/');
                const data = await response.json();
                if (data.success) {
                    ipAddressEl.textContent = data.ip;
                    countryEl.textContent = data.country;
                    cityEl.textContent = data.city;
                    ispEl.textContent = data.connection ? data.connection.isp : '-';
                } else {
                    throw new Error(data.message);
                }
            } catch (e) {
                try {
                    const response = await fetch('https://api.ipify.org?format=json');
                    const data = await response.json();
                    ipAddressEl.textContent = data.ip;
                    countryEl.textContent = '-';
                    cityEl.textContent = '-';
                    ispEl.textContent = '-';
                } catch (e2) {
                    ipAddressEl.textContent = 'Unable to fetch';
                    countryEl.textContent = 'Unable to fetch';
                    cityEl.textContent = 'Unable to fetch';
                    ispEl.textContent = 'Unable to fetch';
                }
            }
        }

        async function measurePing() {
            const iterations = 5;
            let totalPing = 0;
            let success = 0;

            for (let i = 0; i < iterations; i++) {
                try {
                    const start = performance.now();
                    await fetch('https://api.ipify.org?format=json&' + Date.now(), { cache: 'no-store' });
                    const end = performance.now();
                    totalPing += (end - start);
                    success++;
                } catch (e) {
                    try {
                        const start = performance.now();
                        await fetch('https://httpbin.org/get?' + Date.now(), { cache: 'no-store' });
                        const end = performance.now();
                        totalPing += (end - start);
                        success++;
                    } catch (e2) {}
                }
            }

            return success > 0 ? totalPing / success : 0;
        }

        async function testDownload() {
            status.textContent = 'Testing download speed...';
            speedType.textContent = 'Download';

            const testUrls = [
                { url: 'https://proof.ovh.net/files/10Mb.dat', size: 10 * 1024 * 1024 },
                { url: 'https://proof.ovh.net/files/100Mb.dat', size: 100 * 1024 * 1024 }
            ];

            let totalBytes = 0;
            let totalTime = 0;

            for (const test of testUrls) {
                status.textContent = 'Downloading ' + (test.size / 1024 / 1024) + 'MB...';
                const startTime = performance.now();

                try {
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 30000);
                    const response = await fetch(test.url + '?nocache=' + Date.now(), {
                        cache: 'no-store',
                        signal: controller.signal
                    });
                    await response.blob();
                    clearTimeout(timeoutId);
                } catch (e) {
                    continue;
                }

                const endTime = performance.now();
                const duration = (endTime - startTime) / 1000;

                if (duration > 0.5) {
                    totalBytes += test.size;
                    totalTime += duration;
                }
            }

            if (totalTime > 0) {
                const speedMbps = (totalBytes * 8) / totalTime / 1000000;
                updateDisplay(speedMbps, 'Download Speed');
                downloadResult.textContent = speedMbps.toFixed(2) + ' Mbps';
                return speedMbps;
            }

            status.textContent = 'Download test failed. Try again.';
            return 0;
        }

        async function testUpload() {
            status.textContent = 'Testing upload speed...';
            speedType.textContent = 'Upload';

            const uploadSizes = [
                1 * 1024 * 1024,
                5 * 1024 * 1024,
                10 * 1024 * 1024
            ];

            let totalBytes = 0;
            let totalTime = 0;

            for (const size of uploadSizes) {
                status.textContent = 'Uploading ' + (size / 1024 / 1024) + 'MB...';
                const data = new ArrayBuffer(size);
                const view = new Uint8Array(data);
                for (let i = 0; i < size; i++) {
                    view[i] = Math.random() * 256;
                }

                const startTime = performance.now();

                try {
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 30000);
                    await fetch('https://httpbin.org/post', {
                        method: 'POST',
                        body: data,
                        signal: controller.signal
                    });
                    clearTimeout(timeoutId);
                } catch (e) {
                    continue;
                }

                const endTime = performance.now();
                const duration = (endTime - startTime) / 1000;

                if (duration > 0.5) {
                    totalBytes += size;
                    totalTime += duration;
                }
            }

            if (totalTime > 0) {
                const speedMbps = (totalBytes * 8) / totalTime / 1000000;
                updateDisplay(speedMbps, 'Upload Speed');
                uploadResult.textContent = speedMbps.toFixed(2) + ' Mbps';
                return speedMbps;
            }

            status.textContent = 'Upload test failed. Try again.';
            return 0;
        }

        async function testSpeed(type) {
            setButtonsDisabled(true);
            loader.style.display = 'block';
            status.textContent = 'Starting test...';
            speedValue.textContent = '...';
            results.style.display = 'none';

            try {
                const ping = await measurePing();
                pingResult.textContent = Math.round(ping) + ' ms';

                if (type === 'download') {
                    await testDownload();
                } else {
                    await testUpload();
                }

                results.style.display = 'block';
                status.textContent = 'Test completed!';
            } catch (error) {
                status.textContent = 'Error: ' + error.message;
            }

            loader.style.display = 'none';
            setButtonsDisabled(false);
        }

        async function testBoth() {
            setButtonsDisabled(true);
            loader.style.display = 'block';
            status.textContent = 'Starting full test...';
            speedValue.textContent = '...';
            results.style.display = 'none';

            try {
                status.textContent = 'Measuring ping...';
                const ping = await measurePing();
                pingResult.textContent = Math.round(ping) + ' ms';

                await testDownload();
                await testUpload();

                results.style.display = 'block';
                status.textContent = 'Full test completed!';
            } catch (error) {
                status.textContent = 'Error: ' + error.message;
            }

            loader.style.display = 'none';
            setButtonsDisabled(false);
        }

        fetchIPInfo();
    </script>
</body>
</html>
